spring:
  application:
    name: Chemist-System
  main:
    allow-bean-definition-overriding: true
    allow-circular-references: true

  # Central Database Configuration
  datasource:
    url: jdbc:mysql://localhost:3306/chemist_central?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: Snowbit
    password: jfm15.ml
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 5
      pool-name: CentralHikariPool

  # Tenant Database Configuration
  tenant:
    datasource:
      url-pattern: jdbc:mysql://localhost:3306/chemist_tenant_#{tenantId}?useSSL=false&serverTimezone=UTC

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        use_sql_comments: true

  # Mail Configuration
  mail:
    host: smtp.yourprovider.com
    port: 587
    username: your-email@example.com
    password: your-email-password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          ssl:
            trust: smtp.yourprovider.com

# Application Security Configuration
